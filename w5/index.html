<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端心電感應 - Cyberpunk Telepathy</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0A0B10',       /* 深黑藍底色 */
              card: '#121520',     /* 科技卡片底色 */
              text: '#E2E8F0',     /* 主文字 */
              muted: '#64748B',    /* 灰藍次要文字 */
              cyan: '#00F0FF',     /* 電光青藍 */
              pink: '#FF007F',     /* 霓虹粉紅 */
              green: '#00FF66',    /* 毒綠色 (成功狀態) */
              border: '#1E293B',   /* 基礎邊框 */
              glowCyan: 'rgba(0, 240, 255, 0.4)',
              glowPink: 'rgba(255, 0, 127, 0.4)'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    body {
      font-family: 'Share Tech Mono', monospace, system-ui;
    }

    /* Neon Glow UI Effects */
    .glow-cyan {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .glow-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
    }
    .text-glow-cyan {
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .text-glow-pink {
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    /* 3D 翻牌動畫效果 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-cyber-bg text-cyber-text min-h-screen flex flex-col items-center p-4 sm:p-8 selection:bg-cyber-cyan selection:text-black">

  <!-- Header 標題區 -->
  <header class="w-full max-w-4xl flex justify-between items-center mb-8 border-b border-cyber-border/80 pb-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-cyber-cyan text-glow-cyan flex items-center gap-2">
        <span>⚡</span> TELEPATHY // 雲端心電感應
      </h1>
      <p class="text-xs text-cyber-muted mt-1 tracking-widest uppercase">System Protocol v2.0 - Cyberpunk Edition</p>
    </div>
    
    <!-- 房間與身分資訊（登入後顯示） -->
    <div id="room-info" class="hidden text-right">
      <div class="text-sm font-semibold flex items-center justify-end gap-2 text-cyber-text">
        <span>NODE: <span id="display-room-id" class="text-cyber-cyan underline decoration-cyber-cyan underline-offset-4 font-mono"></span></span>
        <!-- 隱藏房主開關按鈕 -->
        <button id="toggle-host-btn" onclick="toggleHostConsole()" title="切換房主權限" class="hover:scale-125 transition transform">
          👑
        </button>
      </div>
      <div class="text-xs text-cyber-muted mt-1">
        USER: <span id="display-player-name" class="text-cyber-text"></span>
        <span id="host-badge" class="hidden text-[10px] bg-cyber-pink text-white font-bold px-1.5 py-0.5 rounded ml-1 glow-pink">HOST</span>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="w-full max-w-4xl">

    <!-- 步驟 1: 登入 / 選擇房間與名稱 -->
    <section id="step-login" class="bg-cyber-card border border-cyber-cyan/30 rounded-xl p-6 sm:p-8 glow-cyan max-w-md mx-auto transition-all">
      <h2 class="text-lg font-bold mb-4 text-cyber-cyan tracking-wider flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyber-cyan animate-ping"></span> 連線至系統節點
      </h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-cyber-muted mb-1 tracking-widest uppercase">PLAYER ID (暱稱)</label>
          <input type="text" id="input-player-name" placeholder="例如：NEO" class="w-full px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg focus:outline-none focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan text-sm text-cyber-cyan" />
        </div>
        
        <div>
          <label class="block text-xs font-medium text-cyber-muted mb-1 tracking-widest uppercase">ROOM CODE (房號)</label>
          <input type="text" id="input-room-id" placeholder="例如：2077 (預設: 8888)" class="w-full px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg focus:outline-none focus:border-cyber-cyan focus:ring-1 focus:ring-cyber-cyan text-sm text-cyber-cyan" />
        </div>

        <button onclick="joinRoom()" class="w-full bg-cyber-cyan hover:bg-cyan-400 text-black py-2.5 rounded-lg text-sm font-bold tracking-wider transition glow-cyan uppercase">
          [ ACCESS SYSTEM / 進入房間 ]
        </button>
      </div>
    </section>

    <!-- 步驟 2: 遊戲主要區域 (登入後顯示) -->
    <section id="step-game" class="hidden space-y-6">

      <!-- 隱藏控制台 (僅房主開啟時顯示) -->
      <div id="host-console" class="hidden bg-cyber-card border-2 border-cyber-pink rounded-xl p-5 glow-pink">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-cyber-pink text-glow-pink flex items-center gap-1.5">
            🔒 HOST CONTROL PANEL <span class="text-xs font-normal text-cyber-muted">(OVERRIDE ACCESS)</span>
          </h3>
          <span class="text-xs text-cyber-muted">STATUS: <span id="current-status" class="font-mono text-cyber-pink">setup</span></span>
        </div>
        
        <!-- 出題控制區 -->
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="input-question" placeholder="輸入心電感應題目..." class="flex-1 px-3 py-2 bg-cyber-bg border border-cyber-pink/50 rounded-lg focus:outline-none focus:border-cyber-pink text-sm text-cyber-pink" />
          <button onclick="setQuestion()" class="bg-cyber-pink hover:bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap glow-pink">
            發布題目
          </button>
          <button onclick="revealAnswers()" class="bg-cyber-cyan hover:bg-cyan-400 text-black px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap glow-cyan">
            🎴 一鍵開牌
          </button>
          <button onclick="resetGame()" class="border border-cyber-border hover:bg-cyber-border text-cyber-muted hover:text-white px-3 py-2 rounded-lg text-sm transition">
            重置
          </button>
        </div>
      </div>

      <!-- 題目顯示區 -->
      <div class="bg-cyber-card border border-cyber-border rounded-xl p-6 text-center shadow-lg relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyber-cyan via-cyber-pink to-cyber-cyan"></div>
        <span class="text-xs uppercase tracking-widest text-cyber-muted font-bold">CURRENT MISSION</span>
        <h2 id="display-question" class="text-xl sm:text-2xl font-bold mt-2 text-cyber-cyan text-glow-cyan">
          WAITING FOR HOST QUESTION...
        </h2>
      </div>

      <!-- 玩家填答區 -->
      <div id="answer-input-box" class="bg-cyber-card border border-cyber-border rounded-xl p-5">
        <h3 class="text-sm font-bold mb-3 text-cyber-text tracking-wide">輸入你的數據回應：</h3>
        <div class="flex gap-3">
          <input type="text" id="input-my-answer" placeholder="輸入你的答案..." class="flex-1 px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg focus:outline-none focus:border-cyber-cyan text-sm text-cyber-cyan" />
          <button onclick="submitAnswer()" class="bg-cyber-cyan hover:bg-cyan-400 text-black px-5 py-2 rounded-lg text-sm font-bold transition">
            傳送數據
          </button>
        </div>
        <p id="submit-tip" class="text-xs text-cyber-green mt-2 hidden">✓ DATA TRANSMITTED SUCCESSFULLY (開牌前可修改)</p>
      </div>

      <!-- 答案展示看板（3D 翻牌卡片區） -->
      <div>
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-sm font-bold text-cyber-muted tracking-widest">CONNECTED AGENTS (<span id="player-count" class="text-cyber-cyan">0</span>)</h3>
          <span id="game-status-tag" class="text-xs px-3 py-1 rounded-full bg-cyber-border text-cyber-muted font-mono">STANDBY</span>
        </div>
        
        <!-- 卡片網格 -->
        <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- 翻牌卡片透過 JS 動態生成 -->
        </div>
      </div>

    </section>
  </main>

  <script>
    // 常數與全域變數設定
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzZOVmuV4ZINWVlgQnOoID_mRT10tkdEYM8U7-P0Pm8N0z-H1Vm6Euhe30NXnWLxmAg/exec";

    let currentRoom = "8888";
    let playerName = "";
    let isHost = false;
    let pollingTimer = null;
    let localGameState = {
      status: "setup",
      question: "",
      answers: {}
    };

    // 1. 登入/加入房間
    function joinRoom() {
      const nameInput = document.getElementById('input-player-name').value.trim();
      const roomInput = document.getElementById('input-room-id').value.trim();

      if (!nameInput) {
        alert('請輸入 USER ID！');
        return;
      }

      playerName = nameInput;
      currentRoom = roomInput || "8888";

      // 更新介面 UI
      document.getElementById('display-room-id').innerText = currentRoom;
      document.getElementById('display-player-name').innerText = playerName;
      document.getElementById('step-login').classList.add('hidden');
      document.getElementById('step-game').classList.remove('hidden');
      document.getElementById('room-info').classList.remove('hidden');

      // 啟動輪詢機制 (每 2 秒抓取一次資料)
      fetchGameState();
      pollingTimer = setInterval(fetchGameState, 2000);
    }

    // 2. 切換隱藏房主控制台
    function toggleHostConsole() {
      isHost = !isHost;
      const consoleEl = document.getElementById('host-console');
      const badgeEl = document.getElementById('host-badge');

      if (isHost) {
        consoleEl.classList.remove('hidden');
        badgeEl.classList.remove('hidden');
      } else {
        consoleEl.classList.add('hidden');
        badgeEl.classList.add('hidden');
      }
    }

    // 3. 後端 API 溝通 - GET (輪詢抓取狀態)
    async function fetchGameState() {
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
        const data = await response.json();
        updateUI(data);
      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }

    // 4. 後端 API 溝通 - POST (發送動作)
    async function postAction(payload) {
      payload.room = currentRoom;
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        fetchGameState();
      } catch (err) {
        console.error("Post Error:", err);
      }
    }

    // 5. 房主操作功能
    function setQuestion() {
      const q = document.getElementById('input-question').value.trim();
      if (!q) return alert("請輸入題目！");
      postAction({ action: "set_question", question: q });
    }

    function revealAnswers() {
      postAction({ action: "reveal" });
    }

    function resetGame() {
      document.getElementById('input-question').value = "";
      document.getElementById('input-my-answer').value = "";
      document.getElementById('submit-tip').classList.add('hidden');
      postAction({ action: "reset" });
    }

    // 6. 玩家答題操作
    function submitAnswer() {
      const ans = document.getElementById('input-my-answer').value.trim();
      if (!ans) return alert("請輸入答案！");
      postAction({ action: "submit_answer", playerName: playerName, answer: ans });
      document.getElementById('submit-tip').classList.remove('hidden');
    }

    // 7. 更新前端 UI 視覺與 3D 動畫觸發
    function updateUI(data) {
      localGameState = data;
      const statusTag = document.getElementById('game-status-tag');
      const questionEl = document.getElementById('display-question');
      const statusEl = document.getElementById('current-status');
      
      if (statusEl) statusEl.innerText = data.status;

      // 更新題目
      questionEl.innerText = data.question || "WAITING FOR HOST QUESTION...";

      // 狀態標籤更新
      if (data.status === "setup") {
        statusTag.innerText = "STANDBY";
        statusTag.className = "text-xs px-3 py-1 rounded-full bg-cyber-border text-cyber-muted font-mono";
      } else if (data.status === "playing") {
        statusTag.innerText = "INPUTTING...";
        statusTag.className = "text-xs px-3 py-1 rounded-full bg-cyber-pink/20 text-cyber-pink border border-cyber-pink/50 font-mono text-glow-pink";
      } else if (data.status === "revealed") {
        statusTag.innerText = "REVEALED";
        statusTag.className = "text-xs px-3 py-1 rounded-full bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/50 font-mono text-glow-cyan";
      }

      // 渲染卡片區
      renderCards(data.answers, data.status === "revealed");
    }

    // 8. 渲染卡片與 3D CSS 翻牌
    function renderCards(answers, isRevealed) {
      const grid = document.getElementById('cards-grid');
      const players = Object.keys(answers || {});
      document.getElementById('player-count').innerText = players.length;

      if (players.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-cyber-muted text-sm font-mono">// NO AGENTS SUBMITTED DATA YET...</div>`;
        return;
      }

      grid.innerHTML = players.map(name => {
        const answerText = answers[name];
        const isFlipped = isRevealed ? 'flipped' : '';

        return `
          <div class="h-32 perspective-1000">
            <div class="card-inner ${isFlipped} border border-cyber-border rounded-xl">
              <!-- 卡片正面 (蓋牌狀態) -->
              <div class="card-front bg-cyber-card flex flex-col items-center justify-center p-3 text-center border border-cyber-cyan/20">
                <div class="w-8 h-8 rounded-full bg-cyber-bg border border-cyber-cyan/40 flex items-center justify-center text-cyber-cyan text-sm mb-2 glow-cyan">
                  🤖
                </div>
                <div class="font-bold text-sm text-cyber-text truncate w-full">${name}</div>
                <div class="text-[11px] text-cyber-green mt-1 flex items-center gap-1 font-mono">
                  <span class="w-1.5 h-1.5 rounded-full bg-cyber-green animate-ping"></span> LOCKED
                </div>
              </div>

              <!-- 卡片背面 (開牌狀態) -->
              <div class="card-back bg-cyber-cyan text-black flex flex-col items-center justify-center p-3 text-center font-bold glow-cyan">
                <div class="text-[11px] text-black/70 mb-1 font-mono">${name}'s DATA</div>
                <div class="text-base font-extrabold break-all px-1 tracking-wide">${answerText}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
