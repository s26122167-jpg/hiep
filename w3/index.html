<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAMING LAB - 迷因產生器</title>

  <!-- Google Fonts: Orbitron, Share Tech Mono, Anton & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Serif+TC:wght@700;900&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- CDN html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gaming: {
              bg: '#0a0b10',          /* 電競暗黑背景 */
              card: '#12141d',        /* 裝甲面板底色 */
              border: '#1f2438',      /* 機甲邊框色 */
              neonCyan: '#00f0ff',    /* 青藍霓虹 */
              neonPink: '#ff0055',    /* 桃紅霓虹 */
              neonGreen: '#00ff66',   /* 螢光綠 */
              accent: '#7000ff',      /* 炫彩紫色 */
              text: '#f0f4f8',        /* 高亮文字 */
              muted: '#62708d'        /* 科技灰 */
            }
          },
          fontFamily: {
            sans: ['Orbitron', 'Noto Serif TC', 'sans-serif'],
            mono: ['Share Tech Mono', 'monospace'],
            meme: ['Anton', 'Noto Serif TC', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* 全局 Gaming 風格 */
    body {
      font-family: 'Orbitron', 'Noto Serif TC', sans-serif;
      background-color: #0a0b10;
      color: #f0f4f8;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 賽博龐克微細線條背景 (Grid background) */
    .gaming-grid {
      background-image:
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* 迷因字體 */
    .font-meme {
      font-family: 'Anton', 'Noto Serif TC', sans-serif;
      font-weight: 900;
    }

    /* 文字邊框與陰影 (RGB Glowing Text) */
    .meme-text-shadow {
      text-shadow:
        2px 2px 0 var(--stroke-color, #000000),
       -2px -2px 0 var(--stroke-color, #000000),
        2px -2px 0 var(--stroke-color, #000000),
       -2px 2px 0 var(--stroke-color, #000000),
        0px 2px 0 var(--stroke-color, #000000),
        0px -2px 0 var(--stroke-color, #000000),
        2px 0px 0 var(--stroke-color, #000000),
       -2px 0px 0 var(--stroke-color, #000000),
        0px 0px 12px rgba(0, 240, 255, 0.6);
    }

    /* Gaming 機甲面板風格 */
    .gaming-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #1f2438;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.1);
    }

    /* 霓虹掃掠效果 */
    .shine-effect {
      position: relative;
      overflow: hidden;
    }
    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
      transition: 0.5s ease;
    }
    .shine-effect:hover::before {
      left: 100%;
    }

    /* RGB Glow 按鈕 */
    .btn-gaming {
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 50%, #ff0055 100%);
      background-size: 200% 200%;
      animation: rgbGradient 4s ease infinite;
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    @keyframes rgbGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-gaming:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }
    .btn-gaming:active {
      transform: translateY(0) scale(0.98);
    }

    /* 科技感旋轉 HUD 圈 */
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .seal-spin {
      animation: slowSpin 12s linear infinite;
    }

    /* 電競游標 Cursor */
    .typing-cursor::after {
      content: '_';
      animation: blink 0.6s infinite;
      color: #00f0ff;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 霓虹滑桿樣式 */
    input[type=range] {
      accent-color: #00f0ff;
    }

    /* 自訂電競滾動條 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0b10;
    }
    ::-webkit-scrollbar-thumb {
      background: #00f0ff;
      border-radius: 3px;
      box-shadow: 0 0 8px #00f0ff;
    }

    /* 機甲切角邊框 */
    .gaming-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: #00f0ff;
      transition: all 0.3s ease;
    }
    .g-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .g-tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .g-bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .g-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    .gaming-card:hover .gaming-corner {
      width: 16px;
      height: 16px;
      border-color: #ff0055;
      box-shadow: 0 0 8px #ff0055;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen gaming-grid selection:bg-gaming-neonCyan selection:text-black">

  <!-- Particle Dust Canvas -->
  <canvas id="dustCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- ==================== Header ==================== -->
  <header class="border-b border-gaming-border bg-gaming-card/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gaming-bg border border-gaming-neonCyan flex items-center justify-center text-gaming-neonCyan font-mono font-bold text-xl shadow-[0_0_10px_rgba(0,240,255,0.4)] transform hover:rotate-12 transition-transform">
          🎮
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-sans font-black tracking-wider text-gaming-text flex items-center gap-2">
            CYBER MEME <span class="text-gaming-neonCyan font-mono text-base md:text-lg">// LAB v2.6</span>
          </h1>
          <p id="typewriterText" class="text-[11px] text-gaming-neonGreen -mt-0.5 font-mono min-h-[16px] typing-cursor"></p>
        </div>
      </div>
      <span class="text-xs px-3 py-1 rounded-sm bg-gaming-bg text-gaming-neonPink font-mono border border-gaming-neonPink/40 shadow-[0_0_8px_rgba(255,0,85,0.3)] flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-gaming-neonPink animate-ping"></span>
        SYSTEM READY
      </span>
    </div>
  </header>

  <!-- ==================== Main Content ==================== -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10">

    <!-- ==================== Controls Panel (Left) ==================== -->
    <section class="lg:col-span-5 flex flex-col gap-5 p-5 md:p-6 rounded-xl gaming-card relative border border-gaming-border">
      <div class="gaming-corner g-tl"></div>
      <div class="gaming-corner g-tr"></div>
      <div class="gaming-corner g-bl"></div>
      <div class="gaming-corner g-br"></div>

      <div class="border-b border-gaming-border pb-3 flex items-center justify-between">
        <h2 class="text-sm font-mono font-bold text-gaming-neonCyan flex items-center gap-2 tracking-widest">
          [CONTROL PANEL]
        </h2>
        <span class="text-xs text-gaming-muted font-mono">LIVE_UPDATE: ON</span>
      </div>

      <!-- 1. Upload Base Image -->
      <div class="space-y-1.5">
        <label class="block text-xs font-mono font-bold text-gaming-text">1. LOAD_BASE_IMAGE (選擇圖檔)</label>
        <div id="drop-zone" class="border border-dashed border-gaming-border hover:border-gaming-neonCyan rounded-lg p-4 text-center cursor-pointer bg-gaming-bg/60 hover:bg-gaming-bg transition-all relative group shine-effect">
          <input type="file" id="image-loader" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          <div class="space-y-1 pointer-events-none">
            <div class="w-10 h-10 mx-auto rounded-lg bg-gaming-card flex items-center justify-center text-gaming-neonCyan shadow-sm group-hover:scale-110 transition-transform border border-gaming-border group-hover:border-gaming-neonCyan">
              📁
            </div>
            <p class="text-xs font-mono font-bold text-gaming-text">拖放圖片至此處或點擊上傳</p>
            <p class="text-[10px] text-gaming-muted font-mono">SUPPORTED: PNG, JPG, WEBP</p>
          </div>
        </div>
      </div>

      <!-- 2. Text Input -->
      <div class="space-y-3">
        <div>
          <label for="top-text-input" class="block text-xs font-mono font-bold text-gaming-text mb-1">2. TOP_TEXT (上方文字)</label>
          <input type="text" id="top-text-input" value="當你開招試圖一打五" placeholder="請輸入上方文字..."
            class="w-full bg-gaming-bg border border-gaming-border focus:border-gaming-neonCyan focus:shadow-[0_0_10px_rgba(0,240,255,0.3)] rounded-md px-3.5 py-2 text-sm text-gaming-text outline-none transition-all font-sans">
        </div>

        <div>
          <label for="bottom-text-input" class="block text-xs font-mono font-bold text-gaming-text mb-1">3. BOTTOM_TEXT (下方文字)</label>
          <input type="text" id="bottom-text-input" value="結果發現隊友都在打野" placeholder="請輸入下方文字..."
            class="w-full bg-gaming-bg border border-gaming-border focus:border-gaming-neonCyan focus:shadow-[0_0_10px_rgba(0,240,255,0.3)] rounded-md px-3.5 py-2 text-sm text-gaming-text outline-none transition-all font-sans">
        </div>
      </div>

      <!-- 3. Fine-tuning Sliders -->
      <div class="space-y-3.5 pt-2 border-t border-gaming-border">
        <h3 class="text-xs font-mono font-bold text-gaming-neonPink flex items-center gap-1.5 tracking-wider">
          [ADJUSTMENTS]
        </h3>

        <!-- Font Size Slider -->
        <div>
          <div class="flex justify-between text-xs text-gaming-muted mb-1 font-mono">
            <span>FONT_SIZE</span>
            <span id="font-size-val" class="font-bold text-gaming-neonCyan">38px</span>
          </div>
          <input type="range" id="font-size-slider" min="16" max="80" value="38" class="w-full h-1 bg-gaming-border rounded-lg cursor-pointer">
        </div>

        <!-- Top Position Slider -->
        <div>
          <div class="flex justify-between text-xs text-gaming-muted mb-1 font-mono">
            <span>TOP_POS</span>
            <span id="top-pos-val" class="font-bold text-gaming-neonCyan">5%</span>
          </div>
          <input type="range" id="top-pos-slider" min="0" max="45" value="5" class="w-full h-1 bg-gaming-border rounded-lg cursor-pointer">
        </div>

        <!-- Bottom Position Slider -->
        <div>
          <div class="flex justify-between text-xs text-gaming-muted mb-1 font-mono">
            <span>BOTTOM_POS</span>
            <span id="bottom-pos-val" class="font-bold text-gaming-neonCyan">5%</span>
          </div>
          <input type="range" id="bottom-pos-slider" min="0" max="45" value="5" class="w-full h-1 bg-gaming-border rounded-lg cursor-pointer">
        </div>

        <!-- Color Pickers -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="flex items-center gap-2 bg-gaming-bg/80 p-2 rounded border border-gaming-border">
            <input type="color" id="text-color-picker" value="#ffffff" class="w-7 h-7 rounded border-0 bg-transparent cursor-pointer">
            <label for="text-color-picker" class="text-xs font-mono text-gaming-text">TEXT_COLOR</label>
          </div>
          <div class="flex items-center gap-2 bg-gaming-bg/80 p-2 rounded border border-gaming-border">
            <input type="color" id="stroke-color-picker" value="#000000" class="w-7 h-7 rounded border-0 bg-transparent cursor-pointer">
            <label for="stroke-color-picker" class="text-xs font-mono text-gaming-text">STROKE_COLOR</label>
          </div>
        </div>
      </div>

      <!-- 4. Export Button -->
      <div class="pt-2 mt-auto">
        <button id="download-btn" class="w-full btn-gaming py-3 px-6 rounded-md flex items-center justify-center gap-2 shadow-lg cursor-pointer text-sm shine-effect font-mono font-bold">
          <span>⚡</span>
          <span>EXPORT MEME (GENERATE)</span>
        </button>
      </div>
    </section>

    <!-- ==================== Preview Area (Right) ==================== -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center p-4 md:p-6 rounded-xl gaming-card min-h-[420px] relative border border-gaming-border">
      <div class="gaming-corner g-tl"></div>
      <div class="gaming-corner g-tr"></div>
      <div class="gaming-corner g-bl"></div>
      <div class="gaming-corner g-br"></div>

      <div class="w-full flex items-center justify-between mb-3 px-1">
        <span class="text-xs font-mono font-bold text-gaming-text flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-gaming-neonGreen animate-ping"></span>
          PREVIEW_CANVAS [RENDERER]
        </span>
        <span class="text-[10px] font-mono text-gaming-neonCyan bg-gaming-bg px-2.5 py-0.5 rounded border border-gaming-neonCyan/30">
          AUTO_FIT_ASPECT
        </span>
      </div>

      <!-- Meme Container -->
      <div id="meme-container" class="relative max-w-full overflow-hidden rounded-lg shadow-[0_0_20px_rgba(0,0,0,0.8)] bg-black flex items-center justify-center border border-gaming-border select-none shine-effect group">
        <!-- Default Meme Image -->
        <img id="meme-image" src="https://i.postimg.cc/Gt2rsct9/images.jpg" alt="迷因底圖" class="max-h-[62vh] w-auto object-contain block transition-transform duration-500 group-hover:scale-[1.01]">

        <!-- Top Text Display -->
        <div id="top-text-display" class="absolute top-[5%] left-0 right-0 px-4 text-center font-meme text-white tracking-wide uppercase leading-tight meme-text-shadow break-words pointer-events-none" style="font-size: 38px;">
          當你開招試圖一打五
        </div>

        <!-- Bottom Text Display -->
        <div id="bottom-text-display" class="absolute bottom-[5%] left-0 right-0 px-4 text-center font-meme text-white tracking-wide uppercase leading-tight meme-text-shadow break-words pointer-events-none" style="font-size: 38px;">
          結果發現隊友都在打野
        </div>

        <!-- Cyber HUD Seal -->
        <div class="absolute bottom-3 right-3 pointer-events-none opacity-80 z-20 w-12 h-12 rounded-full border border-gaming-neonCyan/40 bg-gaming-bg/80 backdrop-blur-sm p-0.5 flex items-center justify-center">
          <svg class="w-full h-full text-gaming-neonCyan seal-spin" viewBox="0 0 100 100">
            <path id="sealPath" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" fill="none"/>
            <text font-size="11.5" font-family="Share Tech Mono" fill="currentColor" letter-spacing="2">
              <textPath href="#sealPath">• CYBER MEME • GAMING LAB </textPath>
            </text>
          </svg>
          <span class="font-mono text-[8px] font-bold text-gaming-neonPink absolute">FPS:60</span>
        </div>
      </div>
    </section>

  </main>

  <footer class="border-t border-gaming-border bg-gaming-card/40 py-3.5 text-center text-xs font-mono text-gaming-muted relative z-10">
    <p>© 2026 CYBER MEME LAB • POWERED BY GAMING ENGINE</p>
  </footer>

  <!-- ==================== JavaScript Interactions & Effects ==================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Elements
      const topTextInput = document.getElementById('top-text-input');
      const bottomTextInput = document.getElementById('bottom-text-input');
      const topTextDisplay = document.getElementById('top-text-display');
      const bottomTextDisplay = document.getElementById('bottom-text-display');

      const fontSizeSlider = document.getElementById('font-size-slider');
      const fontSizeVal = document.getElementById('font-size-val');
      const topPosSlider = document.getElementById('top-pos-slider');
      const topPosVal = document.getElementById('top-pos-val');
      const bottomPosSlider = document.getElementById('bottom-pos-slider');
      const bottomPosVal = document.getElementById('bottom-pos-val');

      const textColorPicker = document.getElementById('text-color-picker');
      const strokeColorPicker = document.getElementById('stroke-color-picker');

      const imageLoader = document.getElementById('image-loader');
      const memeImage = document.getElementById('meme-image');
      const memeContainer = document.getElementById('meme-container');
      const downloadBtn = document.getElementById('download-btn');
      const dropZone = document.getElementById('drop-zone');

      // --- 1. TYPEWRITER ANIMATION ---
      const fullText = "GAMING_ENGINE_INITIALIZED // MEME_GENERATOR_READY";
      const typewriterEl = document.getElementById("typewriterText");
      let typeIndex = 0;

      function typeWriter() {
        if (typeIndex < fullText.length) {
          typewriterEl.textContent += fullText.charAt(typeIndex);
          typeIndex++;
          setTimeout(typeWriter, 50);
        }
      }
      typeWriter();

      // --- 2. WEB AUDIO SOUND EFFECTS (Arcade Beep) ---
      let audioCtx = null;
      function playSoftClickSFX() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
      }

      // --- 3. DUST & CLICK PARTICLES CANVAS (CYBER RGB SPARKS) ---
      const canvas = document.getElementById('dustCanvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let burstParticles = [];
      function triggerClickBurst(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const colors = ['#00f0ff', '#ff0055', '#00ff66', '#7000ff'];

        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 2;
          burstParticles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 3 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1
          });
        }
      }

      window.addEventListener('click', (e) => {
        triggerClickBurst(e);
      });

      function animateCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          let bp = burstParticles[i];
          bp.x += bp.vx;
          bp.y += bp.vy;
          bp.vy += 0.05;
          bp.alpha -= 0.03;

          if (bp.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, bp.alpha);
          ctx.fillStyle = bp.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = bp.color;
          ctx.beginPath();
          ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        requestAnimationFrame(animateCanvas);
      }
      animateCanvas();

      // --- 4. MEME GENERATOR INTERACTION LOGIC ---
      topTextInput.addEventListener('input', (e) => {
        topTextDisplay.textContent = e.target.value || '';
      });

      bottomTextInput.addEventListener('input', (e) => {
        bottomTextDisplay.textContent = e.target.value || '';
      });

      fontSizeSlider.addEventListener('input', (e) => {
        const val = e.target.value + 'px';
        fontSizeVal.textContent = val;
        topTextDisplay.style.fontSize = val;
        bottomTextDisplay.style.fontSize = val;
      });

      topPosSlider.addEventListener('input', (e) => {
        const val = e.target.value + '%';
        topPosVal.textContent = val;
        topTextDisplay.style.top = val;
      });

      bottomPosSlider.addEventListener('input', (e) => {
        const val = e.target.value + '%';
        bottomPosVal.textContent = val;
        bottomTextDisplay.style.bottom = val;
      });

      textColorPicker.addEventListener('input', (e) => {
        topTextDisplay.style.color = e.target.value;
        bottomTextDisplay.style.color = e.target.value;
      });

      strokeColorPicker.addEventListener('input', (e) => {
        topTextDisplay.style.setProperty('--stroke-color', e.target.value);
        bottomTextDisplay.style.setProperty('--stroke-color', e.target.value);
      });

      function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
          playSoftClickSFX();
          const reader = new FileReader();
          reader.onload = function(evt) {
            memeImage.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      imageLoader.addEventListener('change', (e) => {
        handleFile(e.target.files[0]);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('border-gaming-neonCyan', 'bg-gaming-bg');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('border-gaming-neonCyan', 'bg-gaming-bg');
        }, false);
      });

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFile(files[0]);
      });

      // --- 5. EXPORT / DOWNLOAD MEME ---
      downloadBtn.addEventListener('click', (e) => {
        playSoftClickSFX();
        downloadBtn.innerHTML = '<span>⏳</span><span>PROCESSING...</span>';
        downloadBtn.disabled = true;

        html2canvas(memeContainer, {
          useCORS: true,
          scale: 2,
          backgroundColor: null
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'cyber-meme.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          downloadBtn.innerHTML = '<span>⚡</span><span>EXPORT MEME (GENERATE)</span>';
          downloadBtn.disabled = false;
        }).catch(err => {
          console.error(err);
          alert('Error exporting meme image.');
          downloadBtn.innerHTML = '<span>⚡</span><span>EXPORT MEME (GENERATE)</span>';
          downloadBtn.disabled = false;
        });
      });
    });
  </script>
</body>
</html>
